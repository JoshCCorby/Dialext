<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Dialext</title>
    <script src="/theme-boot.js"></script>
    <style>
      html, body, #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(45 27% 94%);
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      html.dark #boot-splash {
        background: hsl(208 25% 10%);
      }
      .boot-splash-mark {
        position: relative;
        width: 4.5rem;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.1));
      }
      html.dark .boot-splash-mark {
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.45));
      }
      .boot-splash-mark svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-base {
        color: hsl(167 10% 17% / 0.2);
      }
      html.dark .boot-splash-base {
        color: hsl(47 17% 90% / 0.2);
      }
      .boot-splash-highlight {
        position: absolute;
        inset: 0;
        color: hsl(167 10% 17% / 0.75);
        -webkit-mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        -webkit-mask-size: 220% 100%;
        mask-size: 220% 100%;
        animation: boot-splash-shimmer 2.4s ease-in-out infinite;
      }
      html.dark .boot-splash-highlight {
        color: hsl(47 17% 90% / 0.5);
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: hsl(153 4% 40%);
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.75rem;
        line-height: 1rem;
        text-align: center;
        opacity: 0;
        animation: boot-splash-detail-reveal 0s linear 2s forwards;
      }
      html.dark .boot-splash-detail {
        color: hsl(180 5% 72%);
      }
      @keyframes boot-splash-shimmer {
        0% {
          -webkit-mask-position: 120% 0%;
          mask-position: 120% 0%;
        }
        100% {
          -webkit-mask-position: -20% 0%;
          mask-position: -20% 0%;
        }
      }
      @keyframes boot-splash-detail-reveal {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-highlight {
          animation: none;
          opacity: 0;
        }
      }
    </style>
    <script src="/relay-shim.js"></script>
  </head>
  <body spellcheck="false">
    <div id="boot-splash" data-tauri-drag-region aria-hidden="true">
      <div class="boot-splash-content">
        <div class="boot-splash-mark">
          <svg
            class="boot-splash-base"
            viewBox="0 0 82 100"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M0 0H32A50 50 0 0 1 32 100H0Z M24 24H32A26 26 0 0 1 32 76H24Z"
            />
          </svg>
          <div class="boot-splash-highlight" aria-hidden="true">
            <svg viewBox="0 0 82 100" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M0 0H32A50 50 0 0 1 32 100H0Z M24 24H32A26 26 0 0 1 32 76H24Z"
              />
            </svg>
          </div>
        </div>
        <p class="boot-splash-detail">
          Loading Dialext. This is taking longer than expected.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
